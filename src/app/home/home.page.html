<!-- Content -->
<ion-content [fullscreen]="true">
  <!-- Container generico -->
  <div class="container">
    <!-- Barra azioni -->
    <app-barra-azioni></app-barra-azioni>

    <!-- Lista dei personaggi -->
    <div class="containerDomini">
      <app-dominio-personaggio
        *ngFor="let personaggio of homeSrvc.getPersonaggiList(); let indiceDominio = index"
        [dettagli]="personaggio"
        [indice]="indiceDominio"
        [selectedAccordionValue]="homeSrvc.getSelectedAccordionValue()"
        [accordionOpenVersion]="homeSrvc.getAccordionOpenVersion()"
      ></app-dominio-personaggio>
    </div>

    <p class="empty-state" *ngIf="!homeSrvc.isPersonaggiCaricati()">
      Carica i dati della partita per iniziare
    </p>
  </div>
</ion-content>
